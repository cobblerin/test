plugins {
    id 'fabric-loom' version '1.10.5'
}

version = '0.5.0'
group = 'kr.cobblerin'

repositories {
    exclusiveContent {
        forRepository {
            ivy {
                url = 'https://cdn.modrinth.com/data/MdwFAVRL/versions/PdOzYHKU/'
                patternLayout {
                    artifact '[artifact]-[revision].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModule('com.cobblemon', 'Cobblemon-fabric')
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
    modImplementation 'com.cobblemon:Cobblemon-fabric:1.8.4+1.21.1'
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        cobblemon_donation_pokedex {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

def remapped = tasks.named('remapJar') {
    destinationDirectory = layout.buildDirectory.dir('intermediates/remap')
}
def descriptor = layout.projectDirectory.file('src/main/resources/fabric.mod.json')

['server', 'client'].each { side ->
    def metadataDir = layout.buildDirectory.dir("generated/distribution/${side}")
    def writeMetadata = tasks.register("write${side.capitalize()}Metadata") {
        inputs.file(descriptor)
        outputs.dir(metadataDir)
        doLast {
            def metadata = new groovy.json.JsonSlurper().parse(descriptor.asFile)
            metadata.environment = side
            metadata.entrypoints.keySet().retainAll(['main', side])
            def output = metadataDir.get().file('fabric.mod.json').asFile
            output.parentFile.mkdirs()
            output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n'
        }
    }

    def distribution = tasks.register("${side}Jar", Jar) {
        dependsOn(remapped, writeMetadata)
        archiveBaseName = "${rootProject.name}-${side}"
        destinationDirectory = layout.buildDirectory.dir('libs')
        from({ zipTree(remapped.get().archiveFile.get().asFile) }) {
            exclude 'META-INF/MANIFEST.MF', 'fabric.mod.json'
            exclude(side == 'server' ? ['kr/cobblerin/pokedex/client/**', 'assets/**'] : ['kr/cobblerin/pokedex/server/**'])
        }
        from(metadataDir)
    }
    tasks.named('assemble') {
        dependsOn(distribution)
    }
}
